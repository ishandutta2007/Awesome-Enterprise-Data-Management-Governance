<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <!-- Animated Data Flow Line Gradient -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #8b949e;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #58a6ff;
      }
      
      /* Subtle CSS Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }

      @keyframes dashMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .pulse-bg {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }

      .animated-flow {
        stroke-dasharray: 15, 10;
        animation: dashMove 20s linear infinite;
      }

      .node-1 { animation: floatNode 4s ease-in-out infinite; }
      .node-2 { animation: floatNode 5s ease-in-out infinite 1s; }
      .node-3 { animation: floatNode 4.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Dynamic Network/Grid Elements -->
  <g class="pulse-bg" opacity="0.4">
    <circle cx="1000" cy="100" r="180" fill="#1f6feb" opacity="0.15" filter="url(#glow)"/>
    <circle cx="150" cy="300" r="140" fill="#238636" opacity="0.12" filter="url(#glow)"/>
    <circle cx="600" cy="350" r="160" fill="#8957e5" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Data Lineage / Network Lines -->
  <g fill="none" stroke-linecap="round">
    <path class="animated-flow" d="M 50 80 Q 300 20 600 80 T 1150 50" stroke="url(#flowGrad1)" stroke-width="3"/>
    <path class="animated-flow" d="M 100 350 Q 400 280 800 340 T 1100 320" stroke="url(#flowGrad2)" stroke-width="2.5"/>
  </g>

  <!-- Decorative Floating Data Nodes (Background/Edges) -->
  <g class="node-1">
    <circle cx="1050" cy="120" r="8" fill="#58a6ff" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1050" cy="120" r="18" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  </g>
  <g class="node-2">
    <circle cx="1120" cy="220" r="6" fill="#3fb950" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1120" cy="220" r="14" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.4"/>
  </g>
  <g class="node-3">
    <circle cx="980" cy="280" r="7" fill="#d2a8ff" opacity="0.8" filter="url(#glow)"/>
    <circle cx="980" cy="280" r="16" fill="none" stroke="#d2a8ff" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Content Group (Foreground - Clean & Fully Legible) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="240" height="32" rx="16" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-opacity="0.4" stroke-width="1"/>
      <text x="120" y="21" text-anchor="middle" class="badge-text">ENTERPRISE DATA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">
      Awesome Enterprise Data Management
    </text>
    <text x="0" y="215" class="title" fill="#79c0ff">
      &amp; Governance
    </text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">
      Curated Directory of Data Catalogs, Business Glossaries, Data Lineage &amp; Access Control
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 310)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">📊 Data Catalog</text>

      <!-- Chip 2 -->
      <rect x="142" y="0" width="130" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="207" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">🔗 Data Lineage</text>

      <!-- Chip 3 -->
      <rect x="284" y="0" width="160" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="364" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">🛡️ Access Governance</text>

      <!-- Chip 4 -->
      <rect x="456" y="0" width="150" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="531" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">📖 Metadata Engine</text>
    </g>
  </g>
</svg>
