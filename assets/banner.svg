<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient><linearGradient id="flowGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".1"/><stop offset="50%" stop-color="#79c0ff" stop-opacity=".8"/><stop offset="100%" stop-color="#d2a8ff" stop-opacity=".1"/></linearGradient><linearGradient id="flowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#79c0ff" stop-opacity=".2"/><stop offset="50%" stop-color="#56d364" stop-opacity=".7"/><stop offset="100%" stop-color="#3fb950" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes dashMove{0%{stroke-dashoffset:1000}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:400;font-size:20px;fill:#8b949e}.badge-text{font-weight:600;font-size:13px;fill:#58a6ff}.pulse-bg{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.animated-flow{stroke-dasharray:15,10;animation:dashMove 20s linear infinite}.node-1{animation:floatNode 4s ease-in-out infinite}.node-2{animation:floatNode 5s ease-in-out infinite 1s}.node-3{animation:floatNode 4.5s ease-in-out infinite 2s}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" rx="16"/><g class="pulse-bg" opacity=".4"><circle cx="1000" cy="100" r="180" fill="#1f6feb" filter="url(#glow)" opacity=".15"/><circle cx="150" cy="300" r="140" fill="#238636" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="350" r="160" fill="#8957e5" filter="url(#glow)" opacity=".1"/></g><g fill="none" stroke-linecap="round"><path stroke="url(#flowGrad1)" stroke-width="3" d="M 50 80 Q 300 20 600 80 T 1150 50" class="animated-flow"/><path stroke="url(#flowGrad2)" stroke-width="2.5" d="M 100 350 Q 400 280 800 340 T 1100 320" class="animated-flow"/></g><g class="node-1"><circle cx="1050" cy="120" r="8" fill="#58a6ff" filter="url(#glow)" opacity=".8"/><circle cx="1050" cy="120" r="18" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity=".4"/></g><g class="node-2"><circle cx="1120" cy="220" r="6" fill="#3fb950" filter="url(#glow)" opacity=".8"/><circle cx="1120" cy="220" r="14" fill="none" stroke="#3fb950" stroke-width="1.5" opacity=".4"/></g><g class="node-3"><circle cx="980" cy="280" r="7" fill="#d2a8ff" filter="url(#glow)" opacity=".8"/><circle cx="980" cy="280" r="16" fill="none" stroke="#d2a8ff" stroke-width="1.5" opacity=".4"/></g><g><g transform="translate(80, 0) translate(0, 75)"><rect width="240" height="32" fill="#1f6feb" fill-opacity=".15" stroke="#1f6feb" stroke-opacity=".4" stroke-width="1" rx="16"/><text x="120" y="21" class="badge-text" text-anchor="middle">ENTERPRISE DATA ECOSYSTEM</text></g><text x="0" y="165" class="title" transform="translate(80, 0)">Awesome Enterprise Data Management</text><text x="0" y="215" fill="#79c0ff" class="title" transform="translate(80, 0)">&amp; Governance</text><text x="0" y="270" class="subtitle" transform="translate(80, 0)">Curated Directory of Data Catalogs, Business Glossaries, Data Lineage &amp; Access Control</text><g transform="translate(80, 0) translate(0, 310)"><rect width="130" height="28" x="0" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="65" y="18" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">📊 Data Catalog</text><rect width="130" height="28" x="142" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="207" y="18" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">🔗 Data Lineage</text><rect width="160" height="28" x="284" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="364" y="18" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">🛡️ Access Governance</text><rect width="150" height="28" x="456" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="531" y="18" fill="#c9d1d9" font-family="sans-serif" font-size="12" text-anchor="middle">📖 Metadata Engine</text></g></g></svg>